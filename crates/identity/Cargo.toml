[package]
name = "office-identity"
description = "Resolves PI ID access tokens to Office actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# An in-process PI stand-in that signs access tokens and serves its JWKS and userinfo
# (`testing::FakePi`); enabled only by dev-dependencies.
testing = ["tokio/io-util", "tokio/net", "tokio/time"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
office-identity = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
