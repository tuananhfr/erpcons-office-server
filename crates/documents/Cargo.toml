[package]
name = "office-documents"
description = "Document service of the Office online server: folders, documents, versions, trash, quota, jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Fail points (`Documents::fail_points`) and the ZIP builder (`intake::testing`); enabled only by dev-dependencies.
testing = []

[dependencies]
office-db.workspace = true
office-identity.workspace = true
office-storage.workspace = true
base64.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "sync"] }
tracing.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
