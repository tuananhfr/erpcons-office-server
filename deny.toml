# cargo-deny policy, the same rule as the forks: permissive licences only, copyleft (GPL, AGPL,
# LGPL, MPL) is never linked. Run with `cargo deny check`.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Data licence of the Mozilla root certificates in webpki-root-certs (reqwest's TLS verifier).
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# pi-mock (tests only), pinned by tag.
allow-git = ["https://github.com/tuananhfr/erpcons-account"]

[advisories]
yanked = "warn"
