openapi: 3.1.0
info:
  title: ERPCons Office Online API
  version: 0.2.0-draft
  description: |
    Phases 0–2 of the online tier (ERPCONS OFFICE ONLINE V3.0 §05, §07, §08): documents, folders, immutable versions
    and their restore, trash, quota, sharing (people by email, a public view link, "Shared with me"), and the live room
    of an open document (presence, phase 2 M3). Served on the
    site's origin under `/api/v1`, so browsers need no CORS.

    **Authentication.** Every operation except `/health`, the two `/link`, the three `/signup` operations and `openLive`
    (a ticket, see **Live channel**) takes the user's PI ID access token as
    `Authorization: Bearer`. The server verifies it locally and resolves it to an actor (`actor_id` = PI `sub`): an
    EdDSA JWT (`typ: JWT`) signed by a key in PI's JWKS, with the configured issuer, an unexpired `exp` (and `nbf`/`iat`
    not in the future), an `aud` naming `pi-platform` and an `azp` among Office's clients (by default
    `erpcons-office-web`). A token that fails any check answers 401 `UNAUTHENTICATED`; 503 `UNAVAILABLE` (retryable)
    only when PI's keys cannot be fetched (none cached yet, or a new `kid` while PI is down). A locked PI account keeps
    working until its access token expires (PI: 10 min). The display name comes from PI's userinfo and may be empty
    when PI cannot be asked. When PI's userinfo reports a verified email (`email_verified: true`), the server records
    it and gives the account the invitations waiting for that address. When PI later reports the email unverified or a
    different one, the record is dropped or replaced; permissions the account already took stay. A userinfo answer
    without an email (scope missing, PI unreachable) neither drops nor renews the record.

    **Authorization.** Folders are private to their owner. A document has one owner and may be shared (phase 2,
    Google Docs model): the caller's `role` on it is `owner`, `editor`, `commenter` or `viewer` (granted by email), or
    `link` (anyone holding the public view link, see `openLink`). Access is read from the database on every request,
    so a removed permission is refused at the next request. Anything the caller cannot see (no role, or a document
    its owner trashed, for anyone but the owner) answers 404 `NOT_FOUND`, so existence is not revealed (§08). A caller
    who can see the document but asks for something its role does not allow gets 403 `FORBIDDEN`:

    | Operation | owner | editor | commenter | viewer |
    |---|---|---|---|---|
    | `getDocument`, `getContent`, `listPermissions` (commenter, viewer: owner and self only) | ✓ | ✓ | ✓ | ✓ |
    | `saveContent`, `restoreVersion`, `listVersions`, `getVersionContent`, rename (`updateDocument` with `title` only) | ✓ | ✓ | | |
    | `deleteVersion` | ✓ | | | |
    | `addPermissions`, `updatePermission`, `removePermission`, `enableLink`, `disableLink` | ✓ | ✓ if `editors_can_share` | | |
    | `removePermission` of one's own permission (leave) | | ✓ | ✓ | ✓ |
    | `updatePermission` with `expires_at` (set, change or clear an expiry) | ✓ | | | |
    | `removePermission` of someone else's permission or invitation with `expires_at` set | ✓ | | | |
    | `putShareSettings`, move (`updateDocument` with `folder_id`), trash, restore, purge | ✓ | | | |

    Nobody changes their own permission with `updatePermission` (403); leaving with `removePermission` stays open.
    Roles granted are at most `editor`. When an editor shares again with someone who already has a permission, the
    role changes but the owner's expiry stays; an expired permission can be granted again only by the owner (403).

    **Expiries are the owner's.** Only the owner sets, changes or clears an `expires_at`, on a permission or on the
    link. A sharer whose own permission has an `expires_at` hands out nothing that lasts longer: every permission,
    invitation and link it creates, and every role it raises, ends no later than its own permission (a request with
    no end, or a later one, gets the sharer's end). Lowering a role keeps the expiry it had.

    **Bounds.** A document holds at most 500 permissions and pending invitations together; `addPermissions` past that
    answers 422 `TOO_MANY_PERMISSIONS`. One account may share with at most 200 addresses it has not shared with before
    per rolling 24 h, across documents and with or without `notify` (429 `RATE_LIMITED`, `Retry-After`).

    Downloading, printing and copying are client features: the server serves the bytes to every role (they are
    needed to show the document), and `Document.can_download` tells the client whether to offer them. Saves and
    restores by an editor count against the owner's quota. A copy a recipient saves is a new upload into the
    recipient's own folders (folders are never shared).

    **Errors** share one body (`Error`). `message_vi` is ready to show; clients branch on `code` only. A malformed
    body, path or query answers 422 `INVALID_REQUEST`, a body over the limit 413 `TOO_LARGE`, a method a path does not
    have 405 `METHOD_NOT_ALLOWED`.

    **Body limits.** JSON bodies stop at 64 KiB (413 `TOO_LARGE`, before any byte is read when `Content-Length` says
    so). Only the multipart `POST /documents` and `PUT /documents/{document_id}/content` take files, up to the
    per-file limit in `Me.quota.max_file_bytes`.

    **Rate limits.** Any authenticated operation may answer 429 `RATE_LIMITED` (retryable, with `Retry-After`): per
    client address (an IPv6 client counts by its /64), per actor, per client address for token checks that need a
    signature check (a token already verified and cached, or refused by its form alone, does not count), and per actor
    for uploads and saves streaming at the same time (a few at once).

    **Idempotency.** The create and purge operations take `Idempotency-Key` (1–100 chars); a repeat with the same key
    and body within 24 h returns the first response, a repeat with a different body answers 422
    `IDEMPOTENCY_MISMATCH`, a repeat while the first is still running 503 `UNAVAILABLE` (retryable). Restore, trash and save need no key: repeating them
    is harmless (restoring an active item returns it, trashing a trashed one is a no-op, a repeated save answers the
    version it made, see `saveContent`). Sharing needs no key either: adding a permission someone already has with the
    same role changes nothing and sends no second email.

    **Email.** When SMTP is configured, `addPermissions` with `notify` queues an email ("shared with you", in
    Vietnamese, with the sharer's name (cut to 60 characters in the subject) and verified email, the optional message
    and a link to the document); it is sent in the background with retries for up to 24 h and never delays or fails
    the request. The message is marked as written by the sharer, not by ERPCons Office, and any URL in it is defanged
    (`hxxps://example[.]com`), so it carries no live link. The document title is in the email only when the server is
    configured to include it. Without SMTP the recipient only finds the document in "Shared with me". An email is
    queued only when PI currently reports a verified email for the sharer, and within these rolling 24 h caps: per
    sharer (configured, default 100), per recipient address (10, whoever sends them) and for the whole server
    (configured, default 2000). Past any of them the sharing still succeeds and appears in "Shared with me", but no
    email is queued, and `mail_skipped` counts them.

    **Sign-up** (no sign-in). Office keeps no accounts: a sign-up becomes a PI ID account. `createSignup` checks the
    form, stores the address, the name and a `$2y$` bcrypt hash of the password (never the password), and queues a
    verification email whose link (`/dang-ky/xac-minh/#token=<token>`, valid 48 h) carries a one-time token issued when
    the email is sent; only its sha256 is stored, and each new email voids the previous link. `verifySignup` uses it
    once. Only then does a background job send `POST {PI_ISSUER}/api/v1/service/accounts/register` (PI's D515, Office's
    service key) with the hash, retrying with backoff for up to 7 days, and drops the hash as soon as PI has answered
    for good. An address that already has a PI ID account keeps its PI ID password and gets an email saying so.
    Sign-ups never verified are deleted 7 days after their last submission. Every accepted sign-up gets the same 202,
    whether the address is new, already pending, already verified or past its 3 verification emails a day, so the
    answer never tells whether an address is known. Limits: per client address (429 `RATE_LIMITED`) and for the whole
    server per rolling 24 h (configured, default 100; 429 `SIGNUP_DAILY_LIMIT`). Sign-up is open only when the server
    has SMTP and PI's service key (`getSignupStatus`); otherwise 403 `SIGNUP_CLOSED`.

    **Live channel** (plan-next §2.1, M3; co-editing by region, plan-m4, M4). Several people with the document open see each other through a WebSocket
    room per document, held in the server's memory (one node). Browsers cannot send `Authorization` on a WebSocket, so
    a client first trades its PI token (or the public link's token in `X-Link-Token`) for a one-time ticket
    (`createLiveTicket`: random, valid 30 s, spent by the first attempt to use it, bound to the document and the client
    address), then opens `GET /documents/{document_id}/live?ticket=...` (`openLive`). A PI token never travels in a
    URL. Access is decided like any request (role read from the database, 404 unless visible) when the ticket is
    issued, again at the upgrade, at once after every change made in this process that may affect it (permission
    added, changed or removed, link turned on or off, document or its folder trashed), and every 60 s for changes made
    elsewhere (expiries). A member who may no longer open the document gets `bye` (`revoked`) and close code 4003; a
    member whose role changes gets `mode`. Messages are JSON with `type` and `v` (1); see the `Live*` schemas.

    | Server to client | When |
    |---|---|
    | `hello` | First message: the member's id (`you`), `mode`, `notice`, colour, `seq`, `saved_seq`, `saved_version`, `leader`, everyone present, limits |
    | `presence` | Someone joined, left, changed mode or state: everyone present (`members`) |
    | `mode` | This member's mode changed (role changed, or an editor slot freed up) |
    | `leader` | The leader changed (`null` when nobody edits) |
    | `locks` | The lock table changed, and right after `hello` when any region is locked: region → `{holder, colour}` |
    | `lock.granted` / `lock.denied` | Answer to `lock.acquire` (same `cid`): `region`, `cid`, `holder`, `expires_ms`; `lock.denied` with `cid` `null` when a `lock.renew` failed |
    | `region.update` | Someone else's update: `seq`, `region`, `author`, `payload` |
    | `ack` | This member's update was taken: `cid`, `seq` |
    | `cursor` | Someone else's cursor: `author`, `region`, `range` |
    | `region.replayed` | End of the answer to `region.replay`: `since`, `seq` |
    | `save.request` | To the leader only: the room's log overflowed, save now |
    | `saved` | The leader saved: `saved_seq`, `version` |
    | `bye` | The server ends the session (`reason`), then closes |
    | `error` | A message was refused (`code`, and `cid` when the message had one); fatal ones are followed by a close |

    | Client to server | |
    |---|---|
    | `presence` | `state`: `active` or `idle` |
    | `bye` | Leave; the server closes with 1000 |
    | `lock.acquire` | `region`, `cid` (the client's id for this message) |
    | `lock.renew` / `lock.release` | `region` |
    | `region.update` | `region`, `cid`, `payload` (a string the editor encodes) |
    | `cursor` | `region`, `range` (a string the editor defines) |
    | `region.replay` | `since` (a `seq`) |

    Other `lock.*` and `region.*` types are reserved and answered `error` `UNSUPPORTED`; any other unknown type is
    `INVALID_MESSAGE`. Modes: owner and editor `edit`, commenter `comment`, viewer and link holder `view`; a trashed document is `view`
    for its owner. Link holders are anonymous: they appear without a name, and see nobody's name.

    **Live limits.** A client message or frame over 16 KiB closes the connection (1009), except `region.update`, which
    may be up to 1 MiB (the whole message; configurable, `limits.max_region_message_bytes` in `hello`) on a connection
    that joined with a role allowing edit; any other connection takes 16 KiB frames only. More than 10 frames a second
    (bursts of 20; pongs and binary frames count too; cursors see below) answers `error` `RATE_LIMITED`, `bye`
    `rate_limited` and close 4008, and so do more than 4 MiB of `region.update` at once (then 1 MiB a second) and
    more than 3 `region.replay` at once (then one per 5 s). A document holds at most 50 connections (`error` `ROOM_FULL`, close 4029); at most 10 of them edit, and an
    editor past that joins in `view` mode with `notice` `editor_limit` until a slot frees (then `mode` `edit`); at
    most 30 of them came through the public link (`ROOM_FULL` past that), so people it is shared with always find
    room. One account holds at most 20 connections and one client network (an IPv4 address, or the /56 of an IPv6
    address) 100 (`TOO_MANY_CONNECTIONS`), the server 5000 (`SERVER_BUSY`); the network and server limits are
    configurable. The server pings every 20 s; a connection
    silent for 30 s has left (`bye` `timeout`, close 4000). A client that does not keep up with its messages is
    dropped (close 4013). At shutdown: `bye` `shutdown`, close 1001.

    **Leader.** The most recent editor still present leads (`leader`); when it leaves, the most recent remaining
    editor does. While a room has more than one member in `edit` mode, `saveContent` from anyone but the leader's
    account answers 409 `NOT_LEADER` and writes nothing; with one editor or no room, saves are unchanged.

    **Co-editing (M4).** Members in `edit` mode lock the regions they edit and send each region's new content; the
    server orders the updates, relays them and keeps them until the next save.
    - *Regions* are ids the editors define (`docs/erp-host.md` of the site), 1 to 256 bytes without control
      characters. The server knows only `*` (the whole document) and the order locks `pages`, `slides` and
      `sheet:<id>`. Two members' locks clash when they name the same region, when either is `*`, or when one is
      `sheet:<id>` and the other `cell:<id>:<anything>`. `pages` and `slides` clash only with themselves: which
      annotation, field, slide or shape a page or slide operation touches is unknown to the server. One member's own
      locks never clash (it may hold `*` with its other locks).
    - *Locks.* `lock.acquire` answers `lock.granted` (lease `expires_ms`, 5000) or `lock.denied` naming the clashing
      lock that lapses last (`holder`, `expires_ms` until it lapses); acquiring a lock the member holds renews it.
      A lock lapses unless renewed within its lease (`lock.renew` every 2 s while editing; an accepted
      `region.update` also renews the locks covering it) and goes within a second after; a renewal of a lapsed lock
      that nobody took takes it again. Locks go at once when their holder disconnects, leaves `edit` mode (role
      changed, link turned off) or loses access. A member holds at most 64 (`LOCK_LIMIT`). Every change to the table
      is announced with `locks`; renewals are not.
    - *Modes.* Only `edit` may acquire, renew or update (`FORBIDDEN_MODE`, with `cid` when the message had one);
      `cursor` needs `edit` or `comment`. Releasing is always allowed.
    - *Updates.* `region.update` needs an unlapsed lock of the sender covering the region: the region itself, `*`,
      or for `cell:<id>:...` its `sheet:<id>`; otherwise `LOCK_REQUIRED` (with `cid`). The server gives it the next
      `seq`, answers the sender `ack` and sends `region.update` to everyone else in the room (viewers and link
      holders included). Answers, others' updates and every other event reach a client through one ordered queue,
      so a client sees `ack` and `region.update` in `seq` order. A `cid` resent by the same account (after a
      reconnect too) gets its first `ack` again and is not applied twice; a room remembers the last 4096 `cid`s.
    - *Seq.* One counter numbers every change of a room (presence, modes, locks, updates), so `region.update` seqs
      have gaps. Values are opaque, increasing, below 2^53; a room opened again (also after a restart) numbers
      above everything before it. A client drops a `region.update` whose `seq` is not above the highest it applied.
    - *Log and replay.* A room keeps the `region.update`s since the last save, up to 8 MiB; past that the oldest go
      and the leader gets `save.request` (once until the next save; a new leader is asked again). `region.replay`
      with `since` answers, straight away, every kept update with a higher `seq` then `region.replayed`, or `error`
      `REPLAY_GONE` with `saved_seq` and `saved_version` when updates after `since` are gone or `since` is not a
      seq of this room: reload the content (`X-Document-Version` at least `saved_version`) and replay from
      `saved_seq`. Events queued before the replay may arrive after it with lower seqs; drop them by `seq`. A
      reconnecting client replays first, then resends its unacknowledged updates with their `cid`s.
    - *Saves.* `hello` carries `saved_seq` (the seq the stored content holds every update up to: the last
      leader's save, or the room's starting seq) and `saved_version` (the version that save made; `null` until a
      leader saved in this room). The leader saves with `saveContent` and `X-Live-Seq` (the last update its bytes
      hold); after the commit, if the caller's account leads the room and the seq is newer than `saved_seq` and was
      issued by this room, the room records it, drops the updates up to it and sends everyone `saved`. Otherwise the
      header changes nothing.
    - *Cursors* go to everyone else at once and are never logged: at most 20 a second (bursts of 20) without
      counting towards the message rate; past that they count and are not relayed. A member whose queue is full
      misses cursors instead of being dropped. `range` is at most 1 KiB; `cid` is 1 to 128 visible ASCII
      characters.
    - Version history lists every save; grouping a live session's saves for display is the site's job.

    **Logging.** The server never logs titles, folder names, bytes, emails, names, passwords, link or verification
    tokens or access tokens; audit rows hold ids only (a view through the public link has actor kind `link` and no
    token).
servers:
  - url: /api/v1
security:
  - piBearer: []
tags:
  - name: account
    description: The calling actor.
  - name: folders
    description: Folder tree of one owner.
  - name: documents
    description: Documents, their versions and the trash.
  - name: sharing
    description: Permissions by email, share settings, the public view link and "Shared with me".
  - name: live
    description: The live room of an open document (presence, region co-editing).
  - name: signup
    description: Self sign-up for a free PI ID account, verified by email.
  - name: ops
    description: Operations endpoints.
paths:
  /health:
    get:
      operationId: health
      tags: [ops]
      security: []
      summary: Liveness and readiness (database and storage reachable)
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: The calling actor and its quota
      responses:
        '200':
          description: The actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /folders/{folder_id}/children:
    get:
      operationId: listChildren
      tags: [folders]
      summary: Folders and documents directly inside a folder (`root` for the top level)
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            oneOf:
              - { const: root }
              - { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page, folders first, then documents, each sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [folders, documents, next_cursor]
                properties:
                  folders:
                    type: array
                    items: { $ref: '#/components/schemas/Folder' }
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /folders:
    post:
      operationId: createFolder
      summary: Create a folder (in the root when parent_id is null)
      tags: [folders]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                parent_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                name: { $ref: '#/components/schemas/Name' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /folders/{folder_id}:
    parameters:
      - $ref: '#/components/parameters/FolderId'
    get:
      operationId: getFolder
      tags: [folders]
      summary: An active folder and its path from the top (for breadcrumbs)
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPath' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      operationId: updateFolder
      tags: [folders]
      summary: Rename or move. Moving into itself or a descendant answers 422 `FOLDER_CYCLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/Name' }
                parent_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: trashFolder
      tags: [folders]
      summary: Move the folder and everything in it to the trash
      responses:
        '204': { description: Trashed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /folders/{folder_id}/restore:
    parameters:
      - $ref: '#/components/parameters/FolderId'
    post:
      operationId: restoreFolder
      tags: [folders]
      summary: Restore from the trash (into the root when the former parent is gone or trashed)
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /folders/{folder_id}/purge:
    parameters:
      - $ref: '#/components/parameters/FolderId'
    post:
      operationId: purgeFolder
      tags: [folders]
      summary: Delete a trashed folder for good, with what was trashed together with it
      description: |
        Only a folder in the trash; an active one, one already purged or another actor's answers 404. Subfolders and
        documents trashed in the same operation go with it and free their quota. Items inside it that had been trashed
        on their own earlier stay in the trash and are restored into the root. Cannot be undone.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Purged. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents:
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document from an uploaded file, or a blank one of a kind. Version 1 is durable on 201.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: docx, xlsx, pptx or pdf in phase 1, checked by signature (same table as the site's intake contract).
                title: { $ref: '#/components/schemas/Name' }
                folder_id: { $ref: '#/components/schemas/Id' }
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/Kind' }
                title: { $ref: '#/components/schemas/Name' }
                folder_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      summary: Document metadata
      tags: [documents]
      responses:
        '200':
          description: Metadata.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Rename or move to another folder (does not create a version)
      description: Renaming is for the owner and editors; moving (any `folder_id`) only for the owner, into one of the owner's folders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { $ref: '#/components/schemas/Name' }
                folder_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: trashDocument
      summary: Move a document to the trash (owner only); people it is shared with stop seeing it
      tags: [documents]
      responses:
        '204': { description: Trashed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/restore:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: restoreDocument
      summary: Restore a document from the trash (into the root when its folder is gone or trashed)
      tags: [documents]
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/purge:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: purgeDocument
      tags: [documents]
      summary: Delete a trashed document and all its versions for good
      description: |
        Only a document in the trash; an active one, one already purged or another actor's answers 404. Its versions
        stop counting against the quota; bytes another document still uses are kept. Cannot be undone.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Purged. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getContent
      tags: [documents]
      summary: Bytes of the current version
      responses:
        '200':
          description: The file.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Document-Version: { $ref: '#/components/headers/X-Document-Version' }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveContent
      tags: [documents]
      summary: Save a new immutable version. 200 means durable (§07, §11); nothing is written on any error.
      description: |
        **Repeated save.** A client whose 200 was lost retries with the same `If-Match` and bytes. When `If-Match` is
        the ETag of the version right before the current one, the current version was saved by the caller, and the
        bytes have the same sha256, the save already happened: the answer is 200 with the current version and ETag,
        no version is added and no quota is used. Anything else whose `If-Match` is not current (other bytes, a
        version made by someone else, an older base) answers 409.

        **Live room.** While the document's live room has more than one member editing, only the leader's account may
        save; anyone else gets 409 `NOT_LEADER` with `leader`, the leader's member id (checked after access and after
        the repeated-save rule, before any byte is stored). The leader sends `X-Live-Seq`; see **Live channel**, *Saves*.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag of the version the edit is based on. Missing answers 428 `PRECONDITION_REQUIRED`.
          schema: { type: string }
        - name: X-Live-Seq
          in: header
          required: false
          description: >-
            The `seq` of the last live-room update the bytes hold. Counts only from the room's leader, for a seq of
            the room newer than its `saved_seq`; otherwise ignored. Anything but one header of decimal digits answers
            422 `INVALID_REQUEST` before any byte is stored.
          schema: { type: string, pattern: '^[0-9]+$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SaveConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents/{document_id}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listVersions
      tags: [documents]
      summary: Versions, newest first (owner and editors)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [versions, next_cursor]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/versions/{seq}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/Seq'
    delete:
      operationId: deleteVersion
      tags: [documents]
      summary: Delete an old version for good (owner only)
      description: |
        The version leaves the history; its number is never given to another version, and its content and restore
        answer 404 from then on. The current version cannot be deleted (409 `VERSION_IS_CURRENT`); a trashed document
        answers 404. The bytes are deleted, and stop counting against the owner's quota, only when no other version
        uses the same content (a restored version shares the bytes of the one it restored); otherwise only the version
        goes and the quota does not change. A version already deleted answers 404.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`VERSION_IS_CURRENT`: the current version cannot be deleted; restore or save another first.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /documents/{document_id}/versions/{seq}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/Seq'
    get:
      operationId: getVersionContent
      tags: [documents]
      summary: Bytes of one version (owner and editors)
      description: Any version of the document, the current one included. A `seq` the document does not have answers 404.
      responses:
        '200':
          description: The file as it was saved in that version.
          headers:
            X-Document-Version: { $ref: '#/components/headers/X-Document-Version' }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /documents/{document_id}/versions/{seq}/restore:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/Seq'
    post:
      operationId: restoreVersion
      tags: [documents]
      summary: Make an older version current again, as a new version (owner and editors)
      description: |
        Adds version `latest + 1` whose bytes are those of version `seq`: no bytes are copied and the quota does not
        change; every version stays in the history (until the owner deletes it, see `deleteVersion`). Like a save it names the current version in `If-Match`; any other
        answers 409 `VERSION_CONFLICT` with `latest_version`. A trashed document answers 404. The new version's author
        is the caller. 200 means durable. Repeating a restore whose answer was lost answers 409 (the client reloads).
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag of the current version. Missing answers 428 `PRECONDITION_REQUIRED`.
          schema: { type: string }
      responses:
        '200':
          description: Restored; the document now points at the new version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents/{document_id}/live-ticket:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: createLiveTicket
      tags: [live]
      security: [{ piBearer: [] }, {}]
      summary: A one-time ticket that opens the document's live room
      description: |
        With `Authorization: Bearer` (any role), or without signing in with `X-Link-Token` (the public link's token;
        rate limited per address like `openLink`, audited as a link view). When `X-Link-Token` is sent, it alone
        decides. The ticket is valid for `expires_in` seconds, for this document, from this client address, once.
        Unspent tickets are capped per holder (an account, or a link from one client network: 20), per holder and
        client network (a quarter of the network's cap: 25), per client network (an IPv4 address, or the /56 of an
        IPv6 address: 100), per owner's public links and client network (an eighth of the owner's cap: 37), per
        owner's public links (300; accounts' tickets never count) and on the whole server (10 000). A new ticket past
        a cap makes room by evicting, within that cap, the oldest ticket of the heaviest other party (holders inside
        one client network; client networks for the owner's links and the whole server) only while that party holds
        at least two more there than the requester; else the requester's own oldest there. When the requester holds
        none there, it is refused: 503 `UNAVAILABLE` with `Retry-After: 1` (tickets are spent or lapse within
        30 s). Every cap makes room before any ticket is evicted: a refused request evicts nothing. Spreading tickets
        over many holders or networks so never pushes out anyone else's. A request whose client address is unknown
        answers 503.

        Issuing is rate limited (429 `RATE_LIMITED`, `Retry-After`) per client address (an IPv6 client by its /64; 300
        at once, then 30 a second), per account (120, then 10 a second) and, with `X-Link-Token`, per client address
        for public links (60, then 2 a second). Known residual risk: when every network in a cap holds a single
        ticket, a newcomer is refused rather than pushing anyone out. Keeping one owner's public links full that way
        takes 300 distinct client networks (IPv4 addresses or IPv6 /56) asking again within every 30 s, the whole
        server 10 000; until then only those links (or new tickets server-wide) answer 503, and existing tickets and
        connections are untouched.
      parameters:
        - name: X-Link-Token
          in: header
          required: false
          description: The public link's token, instead of a PI token. Never logged.
          schema: { type: string }
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /documents/{document_id}/live:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: openLive
      tags: [live]
      security: []
      summary: The document's live room (WebSocket upgrade)
      description: |
        A WebSocket handshake (RFC 6455) with a ticket from `createLiveTicket`. A missing, malformed, unknown, spent or
        expired ticket, or one issued for another document or from another address, answers 401 `UNAUTHENTICATED`
        (the ticket is spent either way); access lost since the ticket was issued answers 404. A request that is not a
        WebSocket handshake answers 422 and leaves the ticket unspent. After the upgrade the server sends `hello`
        (`LiveHello`); refusals for capacity arrive as `error` then a close frame (see **Live channel**).
      parameters:
        - name: ticket
          in: query
          required: true
          description: The ticket; single-use and short-lived, so a URL that leaks (an access log) opens nothing.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '101':
          description: Switching to the WebSocket protocol; messages are `LiveServerMessage` and `LiveClientMessage`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{document_id}/permissions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listPermissions
      tags: [sharing]
      summary: Who has access, the share settings and the link state (the share dialog)
      description: |
        The owner and editors see every permission, pending invitations included; commenters and viewers see only
        their own (`permissions` holds one item). Expired and removed permissions are not listed.
      responses:
        '200':
          description: The document's sharing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addPermissions
      tags: [sharing]
      summary: Share with people by email (owner; editors when `editors_can_share`)
      description: |
        Each address is trimmed, NFC-normalized and lowercased. The address of an account whose PI confirmed that
        verified email within the last 30 days gets the permission at once; any other becomes a pending invitation,
        given to the account that next signs in with that verified email (it replaces an expired permission of that
        account). Someone who already has a permission gets `role` instead (no
        second permission). The owner's and the caller's own addresses are skipped. With `notify`, an email is queued
        for each permission added or whose role changed (see **Email**), unless the caller has reached its daily cap.
        Answers the updated sharing, as `listPermissions`, and how many emails the cap held back. A caller other than
        the owner keeps an existing expiry when changing a role, and gets 403 `FORBIDDEN` for a permission that has
        expired (granting it again would undo the owner's expiry). A caller with an expiry of its own passes it on
        (see **Expiries are the owner's**). 422 `TOO_MANY_PERMISSIONS` past 500 per document, 429 `RATE_LIMITED`
        past 200 new addresses per caller and day (see **Bounds**); neither keeps any of the request. In the rare case
        that a sign-in of one of the invited people races this request twice in a row, nothing of the request is kept
        and it answers 503 `UNAVAILABLE` (retryable, with `Retry-After`): send the same request again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails, role, notify]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/Email' }
                role: { $ref: '#/components/schemas/GrantRole' }
                notify: { type: boolean }
                message:
                  type: [string, 'null']
                  maxLength: 1000
                  description: Put into the email; ignored without `notify`. No control characters other than line breaks and tabs.
      responses:
        '200':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionsAdded' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`UNAVAILABLE` (retryable), with `Retry-After`: nothing was kept; send the same request again.'
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /documents/{document_id}/permissions/{permission_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: permission_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    patch:
      operationId: updatePermission
      tags: [sharing]
      summary: Change a permission's role or expiry (owner; editors when `editors_can_share`, role only)
      description: |
        403 `FORBIDDEN` when the permission is the caller's own, or when a caller other than the owner sends
        `expires_at` (expiries are the owner's to set, change or clear). Editors may change the role of others; a
        raised role ends no later than the caller's own permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/GrantRole' }
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: Must be in the future; `null` removes the expiry.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: removePermission
      tags: [sharing]
      summary: Remove a permission or a pending invitation; anyone may remove their own (leave the document)
      description: |
        Takes effect at the next request of the person removed. A permission already gone answers 404. A permission or
        pending invitation with `expires_at` set may be removed only by the owner or by the person it belongs to
        (leaving); others get 403 `FORBIDDEN`, since removing and inviting again would lift the owner's expiry.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/share-settings:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: putShareSettings
      tags: [sharing]
      summary: The two switches of the share dialog's gear (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /documents/{document_id}/link:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: enableLink
      tags: [sharing]
      summary: Turn on "anyone with the link can view" and get the link token (owner; editors when `editors_can_share`)
      description: |
        Returns the link's 256-bit token. While the link is already on, the token stays the same, so calling it again
        is harmless. A new token, which stops the previous link, takes `disableLink` then `enableLink`. The token is
        also in `LinkState.token` for those who may share. The body may be omitted. The site builds the link as
        `/<editor>/#link=<token>`: in the fragment, which browsers send to no server and put in no `Referer`.
        503 `UNAVAILABLE` when the server has no link key.

        Expiry. The owner sets it from this body (absent or `null`: no end), also on a link that is on. Anyone else
        gets 403 `FORBIDDEN` when asking a link that is on for an `expires_at` other than its current one (omit it to
        fetch the link as it is); a new link of theirs ends no later than their own permission.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: Must be in the future; absent or `null` means no expiry.
      responses:
        '200':
          description: The link is on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: disableLink
      tags: [sharing]
      summary: Turn the public link off (owner; editors when `editors_can_share`); a no-op when already off
      description: Only the owner turns off a link with `expires_at` (403 `FORBIDDEN` for others), since turning it on again would drop the end.
      responses:
        '204': { description: Off. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shared:
    get:
      operationId: listShared
      tags: [sharing]
      summary: '"Shared with me": documents other people shared with the caller, most recently shared first'
      description: Only active documents and permissions in force; a document its owner trashed leaves the list.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [documents, unseen, next_cursor]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/SharedDocument' }
                  unseen:
                    type: integer
                    minimum: 0
                    description: How many of all the caller's shared documents (not only this page) are still `new`.
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shared/{document_id}/seen:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: markSharedSeen
      tags: [sharing]
      summary: Clear the `new` mark of a document shared with the caller
      responses:
        '204': { description: Marked; also when it already was. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /link:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      operationId: openLink
      tags: [sharing]
      security: []
      summary: The document behind a public view link, without signing in
      description: |
        `role` is `link`. The token travels in the `X-Link-Token` header, never in the URL, so no access log, proxy or
        `Referer` holds it; the site reads it from its page's fragment (`#link=<token>`). A missing header or a token
        that is unknown, replaced, turned off or expired, or whose document is trashed or purged, answers 404. Limited
        per client address (429 `RATE_LIMITED`). Answers carry `Referrer-Policy: no-referrer`. Each view is audited
        without the token.
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /link/content:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      operationId: getLinkContent
      tags: [sharing]
      security: []
      summary: Bytes of the current version behind a public view link, without signing in (token as in `openLink`)
      responses:
        '200':
          description: The file.
          headers:
            X-Document-Version: { $ref: '#/components/headers/X-Document-Version' }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /signup:
    get:
      operationId: getSignupStatus
      tags: [signup]
      security: []
      summary: Whether this server takes sign-ups
      responses:
        '200':
          description: Open or closed.
          content:
            application/json:
              schema:
                type: object
                required: [open]
                properties:
                  open: { type: boolean }
    post:
      operationId: createSignup
      tags: [signup]
      security: []
      summary: Sign up for a free PI ID account; a verification email follows (see **Sign-up**)
      description: |
        JSON only (a cross-site form cannot post it without CORS). `name` is trimmed, 1–100 characters without control
        characters; `email` trimmed and lowercased, ASCII only (PI refuses others); `password` at least 8 characters and
        at most 72 bytes (bcrypt reads no more), and not the address itself (PI applies no policy to the hash).
        `website` is a field the page hides from people: when it is filled
        the answer is the same 202 and nothing happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 8 }
                website: { type: string }
      responses:
        '202':
          description: Accepted; the same for every accepted sign-up.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { const: true }
        '403':
          description: '`SIGNUP_CLOSED`: this server takes no sign-ups.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`INVALID_REQUEST`; `field` names the field that broke its rule (absent for a malformed body).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`RATE_LIMITED` (per client address, retryable, `Retry-After`) or `SIGNUP_DAILY_LIMIT` (whole server, not retryable).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /signup/verify:
    post:
      operationId: verifySignup
      tags: [signup]
      security: []
      summary: Verify a sign-up's email with the token of its link
      description: |
        The site reads the token from its page's fragment and sends it in the body, so no URL, log or `Referer`
        carries it. A token works once, within 48 h of its email, and only the latest email's token works. The PI ID
        account follows within seconds (background job); the person then signs in with PI ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { const: true }
        '400':
          description: '`INVALID_TOKEN`: unknown, already used, replaced by a newer email, or expired.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /trash:
    get:
      operationId: listTrash
      tags: [documents]
      summary: Trashed folders and documents, most recently trashed first. Purged 30 days after trashing, or on request.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [folders, documents, next_cursor]
                properties:
                  folders:
                    type: array
                    items: { $ref: '#/components/schemas/Folder' }
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    piBearer:
      type: http
      scheme: bearer
      description: PI ID access token, an EdDSA-signed JWT verified against PI's JWKS.
  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FolderId:
      name: folder_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    Seq:
      name: seq
      in: path
      required: true
      description: A version's `version` number.
      schema: { type: integer, minimum: 1 }
    LinkToken:
      name: X-Link-Token
      in: header
      required: true
      description: The token `enableLink` returned (43 characters of base64url). Never logged.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
  headers:
    ETag:
      description: Opaque, strong; changes with every version.
      schema: { type: string }
    X-Document-Version:
      description: The version `seq` the bytes belong to.
      schema: { type: integer, minimum: 1 }
  schemas:
    Id:
      type: string
      format: uuid
    Name:
      type: string
      minLength: 1
      maxLength: 255
      description: Trimmed; no control or bidi characters, no `/` or `\`.
    Kind:
      type: string
      enum: [word, sheet, slide, pdf]
    State:
      type: string
      enum: [ACTIVE, TRASHED]
      description: DRAFT, PURGE_PENDING and PURGED (§07) exist in the database but are never returned.
    SaveState:
      type: string
      enum: [SERVER_DURABLE]
      description: Phase 1 only returns durable versions; NAS_PENDING / NAS_SYNCED come with NAS (§11).
    Me:
      type: object
      required: [actor_id, display_name, quota]
      properties:
        actor_id: { type: string }
        display_name: { type: string }
        quota:
          type: object
          required: [used_bytes, limit_bytes, max_file_bytes]
          properties:
            used_bytes: { type: integer, minimum: 0, description: 'Sum of all versions not purged, deduplicated by checksum.' }
            limit_bytes: { type: integer, minimum: 0 }
            max_file_bytes: { type: integer, minimum: 0 }
    Folder:
      type: object
      required: [id, parent_id, name, state, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        name: { $ref: '#/components/schemas/Name' }
        state: { $ref: '#/components/schemas/State' }
        trashed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FolderPath:
      type: object
      required: [folder, ancestors]
      properties:
        folder: { $ref: '#/components/schemas/Folder' }
        ancestors:
          type: array
          description: From the top-level folder down to the direct parent; empty for a top-level folder. The root is not listed.
          items: { $ref: '#/components/schemas/Folder' }
    Role:
      type: string
      enum: [owner, editor, commenter, viewer, link]
      description: |
        The caller's role on a document. Shells map owner and editor to edit mode, commenter to comment mode, viewer
        and link to view mode.
    GrantRole:
      type: string
      enum: [editor, commenter, viewer]
    Email:
      type: string
      minLength: 3
      maxLength: 254
      description: One `@` with a non-empty part on each side and a dot in the domain; no spaces or control characters.
    Document:
      type: object
      required: [id, folder_id, title, kind, format, size, version, save_state, state, created_at, updated_at, role, owner_name, shared, can_download, can_share]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        folder_id:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: The owner's folder; always `null` for anyone but the owner.
        title: { $ref: '#/components/schemas/Name' }
        kind: { $ref: '#/components/schemas/Kind' }
        format: { type: string, enum: [docx, xlsx, pptx, pdf] }
        size: { type: integer, minimum: 0, description: Bytes of the current version. }
        version: { type: integer, minimum: 1 }
        save_state: { $ref: '#/components/schemas/SaveState' }
        state: { $ref: '#/components/schemas/State' }
        trashed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/Role' }
        owner_name: { type: string, description: The owner's display name (may be empty when PI could not be asked). }
        shared:
          type: boolean
          description: At least one permission or pending invitation is in force, or the public link is on.
        can_download:
          type: boolean
          description: Whether the client offers download, print and copy. Always true for owner and editors; for the other roles the owner's `viewers_can_download`.
        can_share:
          type: boolean
          description: >-
            Whether the client offers the Share button: the caller may add, change and remove permissions and the link.
            The same rule as `Permissions.can_share`: true for the owner, for editors while `editors_can_share`; false
            for commenters, viewers, the public link (`openLink`) and a document in the trash.
    SharedDocument:
      description: A `Document` as listed in "Shared with me".
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          required: [shared_at, new]
          properties:
            shared_at: { type: string, format: date-time, description: When the permission (or the invitation it came from) was made. }
            new: { type: boolean, description: Not yet marked seen (`markSharedSeen`). }
    Person:
      type: object
      required: [actor_id, display_name, email]
      properties:
        actor_id: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'], description: The verified email, when the account has signed in with one. }
    Permission:
      type: object
      required: [id, actor_id, display_name, email, role, pending, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actor_id: { type: [string, 'null'], description: '`null` while the invitation is pending.' }
        display_name: { type: [string, 'null'], description: '`null` while the invitation is pending.' }
        email:
          type: [string, 'null']
          description: >-
            The address invited (also once the invitation was taken, or for a permission granted at once), never the
            account's current email, which may have changed since.
        role: { $ref: '#/components/schemas/GrantRole' }
        pending: { type: boolean, description: No account has signed in with this verified email yet. }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    ShareSettings:
      type: object
      required: [editors_can_share, viewers_can_download]
      properties:
        editors_can_share: { type: boolean, description: 'Editors may change permissions and the link (default true).' }
        viewers_can_download:
          type: boolean
          description: >-
            Commenters, viewers and link viewers may download, print and copy (default true). Advisory: the client
            hides those features, but the server still serves the bytes, which viewing needs.
    LinkState:
      type: object
      required: [enabled, role, expires_at]
      properties:
        enabled: { type: boolean, description: The link is on and not expired. }
        role: { oneOf: [{ const: viewer }, { type: 'null' }] }
        expires_at: { type: [string, 'null'], format: date-time }
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: >-
            The link token, so it can be copied again. Present only while `enabled` and when the caller's `can_share`
            is true; absent (not `null`) for everyone else.
    LinkCreated:
      type: object
      required: [token, role, expires_at]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'The link token: the existing one while the link was already on.' }
        role: { const: viewer }
        expires_at: { type: [string, 'null'], format: date-time }
    Permissions:
      type: object
      required: [role, owner, permissions, total, settings, link, can_share]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        owner: { $ref: '#/components/schemas/Person' }
        permissions:
          type: array
          description: Oldest first, at most 500. Commenters and viewers get only their own.
          items: { $ref: '#/components/schemas/Permission' }
        total:
          type: integer
          minimum: 0
          description: How many permissions the caller could see in all; more than `permissions` holds only past 500.
        settings: { $ref: '#/components/schemas/ShareSettings' }
        link: { $ref: '#/components/schemas/LinkState' }
        can_share: { type: boolean, description: 'The caller may add, change and remove permissions and the link; always equal to `Document.can_share`.' }
    PermissionsAdded:
      description: '`addPermissions`: the updated sharing and how many emails were not queued.'
      allOf:
        - $ref: '#/components/schemas/Permissions'
        - type: object
          required: [mail_skipped]
          properties:
            mail_skipped:
              type: integer
              minimum: 0
              description: >-
                Emails not queued: the caller has no verified email, or a daily cap was reached (see **Email**). 0
                without `notify` or SMTP.
    Version:
      type: object
      required: [version, size, sha256, author_name, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        author_name: { type: string, description: Display name snapshot taken when the version was saved (§06). }
        created_at: { type: string, format: date-time }
    LiveTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'For `openLive`; never logged.' }
        expires_in: { type: integer, description: Seconds it stays valid (30). }
    LiveMode:
      type: string
      enum: [edit, comment, view]
      description: What the shell passes to the editor's `setMode`.
    LiveMember:
      type: object
      required: [id, kind, colour, mode, state]
      properties:
        id: { type: string, description: 'Opaque, unique in the room (`m<n>`); never an account id.' }
        kind: { type: string, enum: [user, link] }
        name:
          type: string
          description: PI display name. Absent for link holders, for a user whose name PI did not give, and in everything a link holder receives.
        person:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: 'Opaque key of the account in this room: the same for every connection (tab) of one account, so the editor can group them; HMAC under a random per-room key, so it never reveals the account and differs in every room (and after a room is reopened). Absent for link holders and in everything a link holder receives.'
        colour: { type: string, pattern: '^#[0-9a-f]{6}$' }
        mode: { $ref: '#/components/schemas/LiveMode' }
        state: { type: string, enum: [active, idle] }
    LiveHello:
      type: object
      required: [type, v, you, mode, notice, colour, seq, leader, members, limits]
      properties:
        type: { const: hello }
        v: { const: 1 }
        you: { type: string, description: This member's id. }
        mode: { $ref: '#/components/schemas/LiveMode' }
        notice:
          type: [string, 'null']
          enum: [editor_limit, null]
          description: '`editor_limit`: the role allows editing, but the room already has 10 editors.'
        colour: { type: string }
        seq: { type: integer, minimum: 0, description: 'The room''s change counter; grows with every change (opaque, below 2^53).' }
        saved_seq:
          type: integer
          minimum: 0
          description: The stored content holds every update up to this seq; replay from here after loading it.
        saved_version:
          type: [integer, 'null']
          description: The version the leader's save at `saved_seq` made; `null` until a leader saved in this room.
        leader: { type: [string, 'null'] }
        members: { type: array, items: { $ref: '#/components/schemas/LiveMember' } }
        limits:
          type: object
          required: [max_editors, max_connections, max_message_bytes, max_region_message_bytes, messages_per_second, ping_secs]
          properties:
            max_editors: { type: integer, description: Members that may edit at once (10); the rest join in view mode with `notice` `editor_limit`. }
            max_connections: { type: integer, description: Connections the room takes in all (50). }
            max_message_bytes: { type: integer, description: Largest message but `region.update` (16 KiB). }
            max_region_message_bytes:
              type: integer
              description: Largest `region.update` this connection takes (1 MiB when it joined able to edit, else 16 KiB).
            messages_per_second: { type: number }
            ping_secs: { type: integer }
    LivePresence:
      type: object
      required: [type, v, seq, members]
      properties:
        type: { const: presence }
        v: { const: 1 }
        seq: { type: integer }
        members: { type: array, items: { $ref: '#/components/schemas/LiveMember' } }
    LiveModeChange:
      type: object
      required: [type, v, seq, mode, notice]
      properties:
        type: { const: mode }
        v: { const: 1 }
        seq: { type: integer }
        mode: { $ref: '#/components/schemas/LiveMode' }
        notice: { type: [string, 'null'], enum: [editor_limit, null] }
    LiveLeader:
      type: object
      required: [type, v, seq, leader]
      properties:
        type: { const: leader }
        v: { const: 1 }
        seq: { type: integer }
        leader: { type: [string, 'null'], description: 'The leading member''s id; `null` when nobody edits.' }
    LiveBye:
      type: object
      required: [type, v, reason]
      properties:
        type: { const: bye }
        v: { const: 1 }
        reason:
          type: string
          enum: [revoked, timeout, shutdown, rate_limited, overloaded]
          description: 'Close codes: revoked 4003, timeout 4000, shutdown 1001, rate_limited 4008, overloaded 4013.'
    LiveErrorCode:
      type: string
      enum:
        - INVALID_MESSAGE
        - UNSUPPORTED_VERSION
        - UNSUPPORTED
        - RATE_LIMITED
        - ROOM_FULL
        - TOO_MANY_CONNECTIONS
        - SERVER_BUSY
        - FORBIDDEN_MODE
        - LOCK_REQUIRED
        - LOCK_LIMIT
        - REPLAY_GONE
      description: >-
        `RATE_LIMITED` is followed by `bye` and close 4008; `ROOM_FULL`, `TOO_MANY_CONNECTIONS` and `SERVER_BUSY`
        refuse a join and are followed by close 4029 (1001 while shutting down). The others leave the connection open.
        `FORBIDDEN_MODE`: the member's mode does not allow the message; `LOCK_REQUIRED`: a `region.update` without a
        covering lock; `LOCK_LIMIT`: the member holds 64 locks; `REPLAY_GONE`: the room no longer holds every update
        after `since`.
    LiveError:
      type: object
      required: [type, v, code]
      properties:
        type: { const: error }
        v: { const: 1 }
        code: { $ref: '#/components/schemas/LiveErrorCode' }
        cid: { type: string, description: The refused message's `cid`, when it had one. }
        saved_seq: { type: integer, description: '`REPLAY_GONE` only: replay from here after reloading the content.' }
        saved_version: { type: [integer, 'null'], description: '`REPLAY_GONE` only: as in `LiveHello`.' }
    LiveLockView:
      type: object
      required: [holder, colour]
      properties:
        holder: { type: string, description: The holding member's id. }
        colour: { type: string, pattern: '^#[0-9a-f]{6}$' }
    LiveLocks:
      type: object
      required: [type, v, seq, locks]
      properties:
        type: { const: locks }
        v: { const: 1 }
        seq: { type: integer }
        locks:
          type: object
          additionalProperties: { $ref: '#/components/schemas/LiveLockView' }
          description: The whole table, region id to holder; lapsed locks leave it within a second.
    LiveLockAnswer:
      type: object
      required: [type, v, region, cid, holder, expires_ms]
      properties:
        type: { type: string, enum: [lock.granted, lock.denied] }
        v: { const: 1 }
        region: { type: string }
        cid: { type: [string, 'null'], description: 'The `lock.acquire`''s `cid`; `null` for a refused `lock.renew`.' }
        holder: { type: string, description: 'Granted: this member. Denied: the holder of the clashing lock that lapses last.' }
        expires_ms: { type: integer, description: 'Milliseconds until that lock lapses unless renewed (granted: the lease, 5000).' }
    LiveRegionUpdate:
      type: object
      required: [type, v, seq, region, author, payload]
      properties:
        type: { const: region.update }
        v: { const: 1 }
        seq: { type: integer }
        region: { type: string }
        author: { type: string, description: The sending member's id. }
        payload: { type: string }
    LiveAck:
      type: object
      required: [type, v, cid, seq]
      properties:
        type: { const: ack }
        v: { const: 1 }
        cid: { type: string }
        seq: { type: integer, description: The seq the update got (the first time, for a resent `cid`). }
    LiveCursor:
      type: object
      required: [type, v, author, region, range]
      properties:
        type: { const: cursor }
        v: { const: 1 }
        author: { type: string }
        region: { type: string }
        range: { type: string }
    LiveRegionReplayed:
      type: object
      required: [type, v, since, seq]
      properties:
        type: { const: region.replayed }
        v: { const: 1 }
        since: { type: integer }
        seq: { type: integer, description: 'The room''s seq when the replay was taken: every update up to it was sent.' }
    LiveSaveRequest:
      type: object
      required: [type, v]
      properties:
        type: { const: save.request }
        v: { const: 1 }
    LiveSaved:
      type: object
      required: [type, v, saved_seq, version]
      properties:
        type: { const: saved }
        v: { const: 1 }
        saved_seq: { type: integer }
        version: { type: integer, description: The version the save made. }
    LiveServerMessage:
      oneOf:
        - $ref: '#/components/schemas/LiveHello'
        - $ref: '#/components/schemas/LivePresence'
        - $ref: '#/components/schemas/LiveModeChange'
        - $ref: '#/components/schemas/LiveLeader'
        - $ref: '#/components/schemas/LiveLocks'
        - $ref: '#/components/schemas/LiveLockAnswer'
        - $ref: '#/components/schemas/LiveRegionUpdate'
        - $ref: '#/components/schemas/LiveAck'
        - $ref: '#/components/schemas/LiveCursor'
        - $ref: '#/components/schemas/LiveRegionReplayed'
        - $ref: '#/components/schemas/LiveSaveRequest'
        - $ref: '#/components/schemas/LiveSaved'
        - $ref: '#/components/schemas/LiveBye'
        - $ref: '#/components/schemas/LiveError'
      discriminator: { propertyName: type }
    LiveClientMessage:
      oneOf:
        - type: object
          required: [type, v, state]
          properties:
            type: { const: presence }
            v: { const: 1 }
            state: { type: string, enum: [active, idle] }
        - type: object
          required: [type, v]
          properties:
            type: { const: bye }
            v: { const: 1 }
        - type: object
          required: [type, v, region, cid]
          properties:
            type: { const: lock.acquire }
            v: { const: 1 }
            region: { $ref: '#/components/schemas/LiveRegionId' }
            cid: { $ref: '#/components/schemas/LiveCid' }
        - type: object
          required: [type, v, region]
          properties:
            type: { type: string, enum: [lock.renew, lock.release] }
            v: { const: 1 }
            region: { $ref: '#/components/schemas/LiveRegionId' }
        - type: object
          required: [type, v, region, cid, payload]
          properties:
            type: { const: region.update }
            v: { const: 1 }
            region: { $ref: '#/components/schemas/LiveRegionId' }
            cid: { $ref: '#/components/schemas/LiveCid' }
            payload: { type: string }
        - type: object
          required: [type, v, region, range]
          properties:
            type: { const: cursor }
            v: { const: 1 }
            region: { $ref: '#/components/schemas/LiveRegionId' }
            range: { type: string, maxLength: 1024, description: At most 1 KiB (UTF-8). }
        - type: object
          required: [type, v, since]
          properties:
            type: { const: region.replay }
            v: { const: 1 }
            since: { type: integer, minimum: 0 }
      description: >-
        Other `lock.*` and `region.*` types are reserved (`UNSUPPORTED`); anything else, or a missing or malformed
        field, is `INVALID_MESSAGE`.
    LiveRegionId:
      type: string
      minLength: 1
      description: 1 to 256 bytes (UTF-8), no control characters; `*`, `pages`, `slides` and `sheet:<id>` are special.
    LiveCid:
      type: string
      pattern: '^[!-~]{1,128}$'
      description: The client's id for the message, unique per account; 1 to 128 visible ASCII characters.
    Error:
      type: object
      required: [code, message_vi, request_id, retryable]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - NAME_TAKEN
            - FOLDER_CYCLE
            - VERSION_CONFLICT
            - VERSION_IS_CURRENT
            - PRECONDITION_REQUIRED
            - QUOTA_EXCEEDED
            - TOO_LARGE
            - UNSUPPORTED_TYPE
            - INVALID_SIGNATURE
            - INVALID_REQUEST
            - IDEMPOTENCY_MISMATCH
            - TOO_MANY_PERMISSIONS
            - RATE_LIMITED
            - UNAVAILABLE
            - METHOD_NOT_ALLOWED
            - INVALID_TOKEN
            - SIGNUP_CLOSED
            - SIGNUP_DAILY_LIMIT
            - NOT_LEADER
        message_vi: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
        field:
          type: string
          enum: [name, email, password]
          description: '`createSignup` only: the field of an `INVALID_REQUEST`.'
  responses:
    Unauthorized:
      description: '`UNAUTHENTICATED`: missing, expired or rejected token. The client refreshes once, then asks to sign in.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`: does not exist, is purged, the caller has no role on it, or it is trashed and the caller is not the owner. Never distinguished.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`FORBIDDEN`: the caller can see the document, but its role does not allow this (see **Authorization**).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VersionConflict:
      description: '`VERSION_CONFLICT`: the current version is not the one in `If-Match`.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [latest_version]
                properties:
                  latest_version: { type: integer, minimum: 1 }
    SaveConflict:
      description: '`VERSION_CONFLICT` (with `latest_version`): the current version is not the one in `If-Match`; or `NOT_LEADER`: several members edit the document live and the caller is not their leader.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  latest_version: { type: integer, minimum: 1, description: '`VERSION_CONFLICT` only.' }
                  leader:
                    type: string
                    description: '`NOT_LEADER` only: the room leader''s member id (as in `hello.leader`), when the room has one. `retryable` stays false: the client waits for that member''s save or for `leader` to name it.'
    Conflict:
      description: '`NAME_TAKEN`: a folder with that name already exists in the same parent.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: '`TOO_LARGE` (over the per-file limit) or `QUOTA_EXCEEDED` (over the actor''s total).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: '`UNSUPPORTED_TYPE`, `INVALID_SIGNATURE`, `FOLDER_CYCLE`, `INVALID_REQUEST`, `IDEMPOTENCY_MISMATCH` or `TOO_MANY_PERMISSIONS`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: '`PRECONDITION_REQUIRED`: `If-Match` is missing.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`RATE_LIMITED` (retryable), with `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: '`UNAVAILABLE`: database, storage or (before its keys are cached) PI unreachable; `retryable` is true.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
