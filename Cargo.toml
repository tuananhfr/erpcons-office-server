[workspace]
resolver = "3"
members = ["apps/server", "crates/api", "crates/db", "crates/documents", "crates/identity", "crates/mail", "crates/signup", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
office-api = { path = "crates/api" }
office-db = { path = "crates/db" }
office-documents = { path = "crates/documents" }
office-identity = { path = "crates/identity" }
office-mail = { path = "crates/mail" }
office-signup = { path = "crates/signup" }
office-storage = { path = "crates/storage" }

# Seals link tokens so sharers can copy a link again (RustCrypto; MIT OR Apache-2.0). Nonces come
# from ring's random source, so no getrandom feature.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
# Password hashes handed to PI for sign-ups: `$2y$` bcrypt, which PHP's password_verify reads on every build (MIT).
# Salts come from ring like every other secret of the server.
bcrypt = { version = "0.19.3", default-features = false, features = ["alloc", "zeroize"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
# SMTP for share notifications: rustls with ring and the platform verifier, as reqwest (no OpenSSL in the musl build).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
multer = "3.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Already in the tree through rustls; also verifies PI's Ed25519 (EdDSA) access tokens.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
# ring rather than reqwest's default aws-lc-rs: no C/cmake toolchain for the musl build, licences pass deny.toml.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = "1.54.1"
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }
